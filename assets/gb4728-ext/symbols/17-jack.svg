<?xml version="1.0" encoding="UTF-8"?>
<!-- 插孔（输入/输出通用） / Jack | GB/T 4728.3（示意画法） | 画布 25 x 25 mm (2.5 mm 栅格) | 引脚: (2.5,10) (2.5,20) -->
<svg xmlns="http://www.w3.org/2000/svg" width="25mm" height="25mm" viewBox="0 0 25 25"><g transform="translate(12.5,12.5)" fill="none" stroke="#0f172a" stroke-width="0.45" stroke-linecap="round" stroke-linejoin="round">
      <!-- 插座外框 + 插孔 -->
      <path d="M -5 -10 H 7 A 5 5 0 0 1 7 0 H -5 Z" />
      <circle cx="2.5" cy="-5" r="2.2" />
      <!-- 两个端子引线 -->
      <line x1="-10" y1="-2.5" x2="-5" y2="-2.5" />
      <line x1="-10" y1="7.5" x2="-5" y2="7.5" />
      <line x1="-5" y1="-2.5" x2="-5" y2="7.5" />
    </g>
</svg>
